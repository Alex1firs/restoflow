<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Restaflow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #050505;
      color: #ededed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 48px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .icon-wrap {
      width: 80px;
      height: 80px;
      background: rgba(249, 115, 22, 0.12);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      font-size: 36px;
    }

    .logo {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f97316;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #ededed;
      margin-bottom: 14px;
      line-height: 1.3;
    }

    p {
      font-size: 15px;
      color: rgba(237, 237, 237, 0.6);
      line-height: 1.65;
      margin-bottom: 32px;
    }

    .retry-btn {
      background: #f97316;
      color: #050505;
      font-weight: 700;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      padding: 13px 28px;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }

    .retry-btn:hover { opacity: 0.88; }

    .hint {
      font-size: 12px;
      color: rgba(237, 237, 237, 0.35);
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Restaflow</div>
    <div class="icon-wrap">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>
      Restaflow needs an internet connection for live orders, POS, kitchen updates, and payments.
      Please reconnect to continue.
    </p>
    <button class="retry-btn" onclick="window.location.reload()">
      Try Again
    </button>
    <p class="hint">This page will reload automatically when connection is restored.</p>
  </div>

  <script>
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
